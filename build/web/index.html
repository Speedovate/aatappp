<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >
  <meta
    name="description"
    content="Official website of the Association of Accredited Tourist Accommodations of Puerto Princesa, Palawan, Inc."
  >
  <meta name="application-name" content="AATAPPP">
  <meta name="theme-color" content="#050505">
  <meta name="msapplication-TileColor" content="#050505">
  <meta property="og:type" content="website">
  <meta property="og:title" content="AATAPPP | Official Website">
  <meta
    property="og:description"
    content="Official website of the Association of Accredited Tourist Accommodations of Puerto Princesa, Palawan, Inc."
  >
  <meta property="og:image" content="/social-preview.png?v=2">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:url" content="https://aatappp.com/">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="AATAPPP | Official Website">
  <meta
    name="twitter:description"
    content="Official website of the Association of Accredited Tourist Accommodations of Puerto Princesa, Palawan, Inc."
  >
  <meta name="twitter:image" content="/social-preview.png?v=2">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="AATAPPP">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="shortcut icon" href="favicon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>AATAPPP</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --startup-logo-width: 180px;
    }

    @media (max-width: 640px) {
      :root {
        --startup-logo-width: 120px;
      }
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overscroll-behavior-x: none;
      background: #050505;
    }

    body {
      overflow: hidden;
    }

    body,
    flt-glass-pane,
    flt-scene-host,
    flt-semantics-host,
    flt-semantics,
    [flt-semantics-identifier] {
      -webkit-user-select: text;
      user-select: text;
    }

    #app-startup-splash {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 78% 32%, rgba(152, 204, 61, 0.16), transparent 24%),
        radial-gradient(circle at 16% 88%, rgba(152, 204, 61, 0.14), transparent 28%),
        #050505;
      z-index: 9999;
    }

    #app-startup-splash__content {
      width: 100%;
      height: 100%;
      position: relative;
      padding: 24px;
      box-sizing: border-box;
    }

    #app-startup-splash__logo-wrap {
      position: absolute;
      left: 24px;
      right: 24px;
      top: 24px;
      bottom: 108px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #app-startup-splash__logo {
      width: var(--startup-logo-width);
      height: auto;
      display: block;
      image-rendering: auto;
    }

    #app-startup-splash__footer {
      position: absolute;
      left: 24px;
      right: 24px;
      bottom: 34px;
      display: flex;
      justify-content: center;
      pointer-events: none;
    }

    #app-startup-splash__footer img {
      width: var(--startup-logo-width);
      height: auto;
      display: block;
      opacity: 0.9;
    }

    #social-browser-gate {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
      background:
        radial-gradient(circle at 78% 32%, rgba(152, 204, 61, 0.16), transparent 24%),
        radial-gradient(circle at 16% 88%, rgba(152, 204, 61, 0.14), transparent 28%),
        #050505;
      z-index: 10000;
    }

    html[data-social-inapp="true"] #social-browser-gate {
      display: flex;
    }

    html[data-social-inapp="true"] #app-startup-splash {
      display: none;
    }

    #social-browser-gate__card {
      width: min(100%, 420px);
      padding: 28px 24px;
      border-radius: 28px;
      border: 1px solid rgba(137, 213, 0, 0.24);
      background: rgba(5, 5, 5, 0.9);
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.45);
      box-sizing: border-box;
      text-align: center;
    }

    #social-browser-gate__logo {
      width: min(180px, 52vw);
      height: auto;
      display: block;
      margin: 0 auto 24px;
    }

    #social-browser-gate__title {
      margin: 0 0 12px;
      color: #89d500;
      font: 700 30px/1.05 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    #social-browser-gate__body {
      margin: 0;
      color: rgba(255, 255, 255, 0.88);
      font: 500 15px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #social-browser-gate__actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 24px;
    }

    .social-browser-gate__button {
      width: 100%;
      border: 0;
      border-radius: 999px;
      padding: 15px 18px;
      cursor: pointer;
      font: 700 16px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      transition: transform 160ms ease, opacity 160ms ease, background 160ms ease;
    }

    .social-browser-gate__button:hover {
      transform: translateY(-1px);
    }

    .social-browser-gate__button--primary {
      background: #89d500;
      color: #050505;
    }

    .social-browser-gate__button--secondary {
      background: transparent;
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    #social-browser-gate__hint {
      margin: 16px 0 0;
      color: rgba(255, 255, 255, 0.58);
      font: 500 12px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
  </style>
</head>
<body>
  <div id="app-startup-splash" aria-label="Loading AATAPPP">
    <div id="app-startup-splash__content">
      <div id="app-startup-splash__logo-wrap">
        <img
          id="app-startup-splash__logo"
          src="assets/assets/aatappp/branding/aatappp-white-text.png"
          alt="AATAPPP"
        >
      </div>
      <div id="app-startup-splash__footer" aria-hidden="true">
        <img src="assets/assets/aatappp/branding/sdv-footer-lite.png" alt="">
      </div>
    </div>
  </div>
  <div id="social-browser-gate" aria-modal="true" role="dialog" aria-labelledby="social-browser-gate__title">
    <div id="social-browser-gate__card">
      <img
        id="social-browser-gate__logo"
        src="assets/assets/aatappp/branding/aatappp-white-text.png"
        alt="AATAPPP"
      >
      <h1 id="social-browser-gate__title">Open In Chrome</h1>
      <p id="social-browser-gate__body">
        This website may not render correctly inside social media browsers.
        Open it in Chrome for the best experience.
      </p>
      <div id="social-browser-gate__actions">
        <button
          id="social-browser-gate__open"
          class="social-browser-gate__button social-browser-gate__button--primary"
          type="button"
        >
          Open In Chrome
        </button>
      </div>
      <p id="social-browser-gate__hint">
        If Chrome does not open automatically, tap your browser menu and choose
        “Open in browser”.
      </p>
    </div>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    function getChromeOpenUrl() {
      const href = window.location.href;
      const isAndroid = /Android/i.test(navigator.userAgent || '');
      const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent || '');

      if (isAndroid) {
        const cleanUrl = href.replace(/^https?:\/\//, '');
        return 'intent://' + cleanUrl + '#Intent;scheme=https;package=com.android.chrome;end';
      }

      if (isIOS) {
        return href.replace(/^https:\/\//, 'googlechromes://').replace(/^http:\/\//, 'googlechrome://');
      }

      return href;
    }

    window.addEventListener('DOMContentLoaded', function () {
      const isSocialInApp = window.__AATAPPP_SOCIAL_INAPP__ === true;
      const openButton = document.getElementById('social-browser-gate__open');

      if (openButton) {
        openButton.addEventListener('click', function () {
          window.location.href = getChromeOpenUrl();
        });
      }

      if (!isSocialInApp) {
        return;
      }
    });

    window.addEventListener('flutter-first-frame', function () {
      const splash = document.getElementById('app-startup-splash');
      if (splash) {
        splash.remove();
      }
    });
  </script>
</body>
</html>
